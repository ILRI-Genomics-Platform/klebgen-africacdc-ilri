# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: polypolish_shortread
description: Polish a long-read assembly with paired Illumina reads (per-file bwa mem -a alignment, polypolish filter,
  then polypolish polish)
keywords:
  - polishing
  - assembly
  - short reads
  - hybrid
tools:
  - polypolish:
      description: Short-read polishing of long-read bacterial genome assemblies
      homepage: https://github.com/rrwick/Polypolish
      documentation: https://github.com/rrwick/Polypolish
      tool_dev_url: https://github.com/rrwick/Polypolish
      licence:
        - GPL-3.0-or-later
  - bwa:
      description: Burrows-Wheeler aligner
      homepage: https://github.com/lh3/bwa
      documentation: https://github.com/lh3/bwa
      tool_dev_url: https://github.com/lh3/bwa
      licence:
        - GPL-3.0-or-later
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', species:'kpneumoniae' ]
    - assembly:
        type: file
        description: Draft assembly to polish (plain or gzipped FASTA)
        pattern: '*.{fasta,fa,fa.gz,fasta.gz}'
        ontologies: []
    - reads:
        type: file
        description: Paired-end Illumina reads, R1 then R2
        pattern: '*.{fastq,fastq.gz,fq,fq.gz}'
        ontologies: []
output:
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', species:'kpneumoniae' ]
      - ${prefix}.polypolish.fasta:
          type: file
          description: Polished assembly
          pattern: ${prefix}.polypolish.fasta
          ontologies: []
  versions_polypolish:
    - - ${task.process}:
          type: string
          description: The name of the process
      - polypolish:
          type: string
          description: The name of the tool
      - polypolish polish --version |& sed '1!d;s/Polypolish-polish //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_bwa:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bwa:
          type: string
          description: The name of the tool
      - 'bwa 2>&1 | sed -n "s/^Version: //p"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - polypolish:
          type: string
          description: The name of the tool
      - polypolish polish --version |& sed '1!d;s/Polypolish-polish //':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - bwa:
          type: string
          description: The name of the tool
      - 'bwa 2>&1 | sed -n "s/^Version: //p"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - '@neonatal-amr-training'
maintainers:
  - '@neonatal-amr-training'
