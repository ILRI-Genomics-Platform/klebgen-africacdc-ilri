# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: snippy_contigs
description: Map an assembly (contigs) to a reference with Snippy (--ctgs) and call SNPs, for isolates without reads
keywords:
  - snippy
  - variant calling
  - assembly
  - contigs
tools:
  - snippy:
      description: Rapid haploid variant calling and core genome alignment
      homepage: https://github.com/tseemann/snippy
      documentation: https://github.com/tseemann/snippy
      tool_dev_url: https://github.com/tseemann/snippy
      licence:
        - GPL-2.0-only
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'sample1', phylo_group:'Kpneumoniae_ST39' ]
    - contigs:
        type: file
        description: Assembly in FASTA format
        pattern: '*.{fa,fasta,fna,fas}'
        ontologies: []
  - reference:
      type: file
      description: Reference genome (FASTA or GenBank)
      pattern: '*.{fa,fasta,fna,gbk}'
      ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/${prefix}.vcf:
          type: file
          description: Filtered variant calls
          pattern: '*.vcf'
          ontologies: []
  aligned_fa:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/${prefix}.aligned.fa:
          type: file
          description: Reference-length alignment of the sample (input for snippy-core)
          pattern: '*.aligned.fa'
          ontologies: []
  tab:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/${prefix}.tab:
          type: file
          description: Variants as a table
          pattern: '*.tab'
          ontologies: []
  txt:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/${prefix}.txt:
          type: file
          description: Run summary
          pattern: '*.txt'
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/${prefix}.log:
          type: file
          description: Snippy log
          pattern: '*.log'
          ontologies: []
  versions_snippy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - snippy:
          type: string
          description: The name of the tool
      - snippy --version 2>&1 | sed 's/snippy //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - snippy:
          type: string
          description: The name of the tool
      - snippy --version 2>&1 | sed 's/snippy //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - '@neonatal-amr-training'
maintainers:
  - '@neonatal-amr-training'
